<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trainium stack</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:pointer}
  svg{display:block;width:100vw;height:100vh}
  text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:800;fill:#fff}
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="A Trainium2 device with 8 NeuronCores. Inside one core the Tensor, Vector, Scalar and GpSimd engines light up in turn next to on-chip memory. Collectives move data between the cores. PyTorch and TorchNeuron stack on top, with Kubernetes around everything.">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#0b0d12"/>
  <g id="dyn"></g>
</svg>
<script>
(function(){
  "use strict";
  var LOOP = 23;
  // ---- helpers ----
  function clamp(x){ return x<0?0:x>1?1:x; }
  function prog(t,a,d){ return clamp((t-a)/d); }
  function ease(p){ return p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2; }
  function lerp(a,b,p){ return a+(b-a)*p; }
  function hexA(h,a){ var n=parseInt(h.slice(1),16);
    return "rgba("+(n>>16&255)+","+(n>>8&255)+","+(n&255)+","+a+")"; }
  function R(x,y,w,h,rx,fill,stroke,sw,extra){
    return '<rect x="'+x+'" y="'+y+'" width="'+Math.max(0,w)+'" height="'+Math.max(0,h)+'" rx="'+rx+
      '" fill="'+fill+'"'+(stroke?' stroke="'+stroke+'" stroke-width="'+sw+'"':'')+(extra||'')+'/>'; }
  function T(x,y,s,txt,fill,op){ return '<text x="'+x+'" y="'+y+'" font-size="'+s+'" text-anchor="middle"'+
      ' style="'+(fill?'fill:'+fill+';':'')+'"'+(op!=null?' opacity="'+op+'"':'')+'>'+txt+'</text>'; }

  // ---- geometry ----
  var CHIP = {x:100,y:380,w:820,h:480};
  var CW = 150, CG = 50, CX0 = 135, CY = [478,688];
  function core(i){ return {x:CX0+(i%4)*(CW+CG), y:CY[i<4?0:1], w:CW, h:CW}; }
  var FOCUS = 3;                                   // the core we zoom into (top right)
  var PANEL = {x:990,y:380,w:530,h:480};
  var ENG = [
    {n:"Tensor", c:"#3d9bff", x:1010, y:400},
    {n:"Vector", c:"#2fd39a", x:1265, y:400},
    {n:"Scalar", c:"#ffcc33", x:1010, y:545},
    {n:"GpSimd", c:"#ff6b9a", x:1265, y:545}
  ];
  var EW = 235, EH = 125;
  var MEM = {x:1010,y:700,w:490,h:140}, MEMC = "#b48cff";
  // ring order through the 2x4 grid, and one colour per core (all-gather payloads)
  var RING = [0,1,2,3,7,6,5,4];
  var KC = ["#3d9bff","#2fd39a","#ffcc33","#ff6b9a","#b48cff","#ff7a3d","#22d3ee","#e8ecf4"];
  var LINK = "#22d3ee";

  // ---- timing ----
  var B1 = 0, ZOOM = 1, ENG0 = 2, ESTEP = 1.2, ALL = ENG0+4*ESTEP;  // beat 1
  var B2 = 8, RSTEP = 0.85, NSTEP = 7;                               // beat 2
  var B3 = B2 + 0.6 + NSTEP*RSTEP + 0.6;                              // beat 3 (~15.1 s)

  function render(t){
    var s = '';
    // ====== Kubernetes: outer frame (beat 3, last) ======
    var k8 = ease(prog(t,B3+3.0,1.2));
    if (k8>0){
      s += '<g opacity="'+k8+'">'+R(40,30,1520,850,30,hexA('#5b8cff',.08),'#5b8cff',12)+'</g>';
      s += T(220,108,52,'Kubernetes','#9ab6ff',k8);
    }
    // ====== software layers (beat 3) ======
    var tn = ease(prog(t,B3,1.1)), py = ease(prog(t,B3+1.4,1.1));
    if (tn>0) s += '<g opacity="'+tn+'" transform="translate(0,'+lerp(-60,0,tn)+')">'+
      R(100,262,1420,96,18,'#ff9900')+T(810,326,52,'TorchNeuron','#0b0d12')+'</g>';
    if (py>0) s += '<g opacity="'+py+'" transform="translate(0,'+lerp(-60,0,py)+')">'+
      R(100,148,1420,96,18,'#ee4c2c')+T(810,212,52,'PyTorch','#0b0d12')+'</g>';

    // ====== device with 8 NeuronCores ======
    var dev = ease(prog(t,B1,0.9));
    s += '<g opacity="'+dev+'">';
    s += R(CHIP.x,CHIP.y,CHIP.w,CHIP.h,26,'#121826','#8fa3c7',8);
    // collective links (beat 2): thick bars between ring neighbours
    var lk = ease(prog(t,B2,0.6));
    for (var r=0;r<8;r++){
      var a = core(RING[r]), b = core(RING[(r+1)%8]), L = linkRect(a,b);
      s += R(L.x,L.y,L.w,L.h,8, lk>0?hexA(LINK,0.25+0.55*lk):'#2a3246');
    }
    var col = ease(prog(t,B2,0.6));
    if (col>0) s += T(CHIP.x+CHIP.w/2, CHIP.y+68, 50, 'Collectives', LINK, col);
    // ring step progress (all-gather: each step every core passes one block to its neighbour)
    var stepT = (t - (B2+0.6)) / RSTEP, step = Math.floor(stepT), sp = stepT - step;
    for (var i=0;i<8;i++){
      var c = core(i), lit = (i===FOCUS) && t>=ZOOM;
      s += R(c.x,c.y,c.w,c.h,18,'#1f2940', lit?'#ffffff':'#6f86b8', lit?10:6, lit?' filter="url(#glow)"':'');
      // engine dots in each core (a tiny echo of the zoomed core)
      for (var e=0;e<4;e++){
        var on = engOn(t,e);
        s += R(c.x+18+(e%2)*62, c.y+16+Math.floor(e/2)*40, 52, 30, 7,
               on ? ENG[e].c : hexA(ENG[e].c,.35));
      }
      // received blocks: 8 slots, fill as the all-gather proceeds
      var pos = RING.indexOf(i);
      for (var k=0;k<8;k++){
        var src = RING[(pos - k + 8) % 8];   // k = 0 is the core's own block
        var have = (t >= B2) && (k===0 || (stepT >= k));
        s += R(c.x+12+k*16, c.y+c.h-40, 14, 28, 3, have?KC[src]:'#0b0d12');
      }
    }
    // packets moving along every link at once
    if (t >= B2+0.6 && step < NSTEP && step >= 0){
      for (r=0;r<8;r++){
        var from = RING[r], to = RING[(r+1)%8];
        var payload = RING[(r - step + 8) % 8];
        var A = core(from), Bc = core(to);
        var e2 = ease(clamp(sp/0.85));
        var px = lerp(A.x+A.w/2, Bc.x+Bc.w/2, e2), py2 = lerp(A.y+A.h/2, Bc.y+Bc.h/2, e2);
        s += R(px-20,py2-20,40,40,8,KC[payload],'#0b0d12',5,' filter="url(#glow)"');
      }
    }
    s += '</g>';

    // ====== zoom into one core: four engines + on-chip memory ======
    var zm = ease(prog(t,ZOOM,0.9));
    if (zm>0){
      var f = core(FOCUS);
      s += '<g opacity="'+zm+'">';
      // thick connector from the focused core to the panel
      s += '<polygon points="'+(f.x+f.w)+','+(f.y+10)+' '+PANEL.x+','+PANEL.y+' '+PANEL.x+','+(PANEL.y+PANEL.h)+' '+(f.x+f.w)+','+(f.y+f.h-10)+'" fill="rgba(255,255,255,.10)"/>';
      s += R(PANEL.x,PANEL.y,PANEL.w,PANEL.h,26,'#121826','#ffffff',8);
      for (e=0;e<4;e++){
        var E = ENG[e], o = engOn(t,e);
        s += R(E.x,E.y,EW,EH,18, o?E.c:hexA(E.c,.18), E.c, o?10:6, o?' filter="url(#glow)"':'');
        s += T(E.x+EW/2, E.y+EH/2+15, 42, E.n, o?'#0b0d12':'#ffffff');
      }
      // on-chip memory: a block of cells (shape only)
      var mOn = anyEng(t);
      s += R(MEM.x,MEM.y,MEM.w,MEM.h,18, hexA(MEMC, mOn?.35:.15), MEMC, mOn?10:6, mOn?' filter="url(#glow)"':'');
      for (var my=0;my<3;my++) for (var mx=0;mx<10;mx++)
        s += R(MEM.x+22+mx*46, MEM.y+20+my*36, 34, 26, 5, hexA(MEMC, mOn?.95:.5));
      // data pulse from memory up into the active engine
      for (e=0;e<4;e++){
        var a0 = ENG0 + e*ESTEP, pp = prog(t,a0,ESTEP*0.7);
        if (pp>0 && pp<1 && t < ALL){
          var Ee = ENG[e], ex = Ee.x+EW/2;
          var y0 = MEM.y+10, y1 = Ee.y+EH-10, yy = lerp(y0,y1,ease(pp));
          s += R(ex-18,yy-18,36,36,8,'#ffffff',null,0,' filter="url(#glow)"');
        }
      }
      s += '</g>';
    }
    document.getElementById('dyn').innerHTML = s;
  }

  function engOn(t,e){
    if (t < ENG0) return false;
    if (t < ALL) return t >= ENG0+e*ESTEP && t < ENG0+(e+1)*ESTEP;
    return t < ALL + 1.0 || t >= B3 + 4.5;      // all four together, then again in the final picture
  }
  function anyEng(t){ return engOn(t,0)||engOn(t,1)||engOn(t,2)||engOn(t,3); }
  function linkRect(a,b){
    var W = 26;
    if (a.y === b.y){ // horizontal neighbours
      var x1 = Math.min(a.x,b.x)+CW, x2 = Math.max(a.x,b.x);
      return {x:x1-4, y:a.y+CW/2-W/2, w:x2-x1+8, h:W};
    }
    var y1 = Math.min(a.y,b.y)+CW, y2 = Math.max(a.y,b.y);
    return {x:a.x+CW/2-W/2, y:y1-4, w:W, h:y2-y1+8};
  }

  // ---- loop / restart / reduced motion ----
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = performance.now();
  function restart(){ t0 = performance.now(); }
  var hm = /t=([\d.]+)/.exec(location.hash);       // e.g. #t=10 freezes at 10 s (for checking)
  if (hm){ render(parseFloat(hm[1])); return; }
  if (reduce){ render(LOOP - 0.01); return; }
  function tick(now){ render(((now - t0)/1000) % LOOP); requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
  document.addEventListener('click', restart);
  document.addEventListener('keydown', function(ev){ if (ev.code==='Space'){ ev.preventDefault(); restart(); } });
})();
</script>
</body>
</html>
