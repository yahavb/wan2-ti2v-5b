apiVersion: batch/v1
kind: Job
metadata:
  name: wan2-ti2v-5b-tp8
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: wan2-ti2v-5b-tp8
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn2
      resourceClaims:
        # Same physical device as the TP=4 job, exposed as 8 logical cores (LNC1).
        - name: s-lnc1
          resourceClaimTemplateName: s-lnc1
      containers:
        - name: inference
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          #image: 621547421844.dkr.ecr.us-west-2.amazonaws.com/native-pytorch:2.11.0-neuronx-py312-sdk2.31.0-ubuntu24.04-neurondlcbuilder-development-6486001458-0
          imagePullPolicy: Always
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euxo pipefail

              cd /tmp
              git clone -b loop_engineering https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/wan2-ti2v-5b.git
              cd wan2-ti2v-5b

              # New SDK 2.31 DLC image does NOT auto-activate a venv -> `uv pip install`
              # errors with "No virtual environment found". Target the SAME interpreter
              # python3 uses (where torch-neuronx already lives) via --python.
              UVPY="$(command -v python3)"
              echo "uv target interpreter: $UVPY"

              # ─── Install deps ─────────────────────────────────────────────
              sed -i '/flash_attn/d' wan_requirements.txt
              sed -i '/torchaudio/d' wan_requirements.txt
              # SDK 2.31 image ships numpy 2.5.1; the SDK's own NKI kernels (e.g.
              # nki_..._set_rng_state_gpsimd fired at init_process_group) use np.long,
              # re-added as an alias only in numpy>=2.0. The old `numpy<2` pin downgrades
              # to 1.26.4 (np.long removed in 1.24) -> "module 'numpy' has no attribute
              # 'long'" neuronx-cc exit 70. Strip the pin so the image's numpy 2.x stays.
              sed -i '/numpy/d' wan_requirements.txt
              uv pip install --python "$UVPY" -r wan_requirements.txt
              uv pip install --python "$UVPY" "setuptools<81"
              uv pip install --python "$UVPY" git+https://github.com/pytorch/vision.git@v0.25.0 --no-deps --no-cache --no-build-isolation

              # SDK 2.31 DLC ships a python3 built WITHOUT the _lzma stdlib extension.
              # torchvision eagerly imports datasets/utils.py -> `import lzma`, which
              # crashes the whole `import torchvision` chain at import time. torchvision.io
              # (all we actually use) never opens .xz files, so replace lzma with a stub
              # namespace that exposes .open (raises only if actually called) so import
              # succeeds.
              "$UVPY" - <<'PY'
              import importlib.util as u, pathlib
              loc = u.find_spec('torchvision').submodule_search_locations[0]
              p = pathlib.Path(loc) / 'datasets' / 'utils.py'
              s = p.read_text()
              if '_no_lzma' not in s:
                  stub = (
                      'try:\n'
                      '    import lzma\n'
                      'except ImportError:\n'
                      '    import types as _t\n'
                      '    def _no_lzma(*a, **k):\n'
                      '        raise RuntimeError("lzma unavailable in this Python build")\n'
                      '    lzma = _t.SimpleNamespace(open=_no_lzma, LZMAFile=_no_lzma)\n'
                  )
                  s = s.replace('import lzma\n', stub, 1)
                  p.write_text(s)
                  print('Patched torchvision datasets/utils.py: lzma replaced with stub')
              else:
                  print('torchvision datasets/utils.py already patched')
              PY

              # einops preinstalled on the old concourse image, absent from the SDK 2.31
              # native-pytorch image and not in wan_requirements.txt -> add it explicitly.
              uv pip install --python "$UVPY" imageio imageio-ffmpeg einops

              # ─── Model caching (S3-backed PVC tar pattern) ───────────────
              MODEL_TAR="/var/mdl/wan2_2_ti2v/Wan2.2-TI2V-5B.tar"
              MODEL_LOCAL="/tmp/Wan2.2-TI2V-5B"

              if [[ -f "$MODEL_TAR" ]]; then
                echo "Copying model tar from S3 cache..."
                cp "$MODEL_TAR" /tmp/Wan2.2-TI2V-5B.tar
                echo "Extracting..."
                tar xf /tmp/Wan2.2-TI2V-5B.tar -C /tmp/
                rm -f /tmp/Wan2.2-TI2V-5B.tar
              else
                echo "Downloading model from HuggingFace..."
                python3 -c "
              from huggingface_hub import snapshot_download
              snapshot_download('Wan-AI/Wan2.2-TI2V-5B', local_dir='${MODEL_LOCAL}', local_dir_use_symlinks=False)
              "
                echo "Creating tar archive for S3 cache..."
                tar cf /tmp/Wan2.2-TI2V-5B.tar -C /tmp Wan2.2-TI2V-5B
                mkdir -p "$(dirname $MODEL_TAR)"
                cp /tmp/Wan2.2-TI2V-5B.tar "$MODEL_TAR"
                rm -f /tmp/Wan2.2-TI2V-5B.tar
                echo "Cached tar to S3!"
              fi
              echo "Model weights ready at $MODEL_LOCAL"

              # ─── 3-run benchmark: clean (compile + warm) -> profiled -> per-graph analysis ───
              # All logic lives in scripts/prof/bench_profile.sh (committed, so the pod's clone has it).
              export WAN_DIR="/tmp/wan2-ti2v-5b"
              export MODEL_PATH=/tmp/Wan2.2-TI2V-5B
              cd /tmp/wan2-ti2v-5b
              bash scripts/prof/bench_profile.sh 2>&1 || true
              RESULTS=$(cat /tmp/results/LATEST 2>/dev/null || true)

              echo "═══════════════════════════════════════════"
              echo "  Done! TP=${TP_DEGREE} benchmark complete"
              echo "═══════════════════════════════════════════"

              # Keep the pod alive so outputs can be pulled with kubectl cp (no S3 here):
              #   kubectl cp <pod>:<results>.tar.gz .   (path printed below)
              # KEEP_ALIVE_SECONDS=0 exits immediately.
              if [[ "${KEEP_ALIVE_SECONDS:-0}" != "0" ]]; then
                # Neuron Explorer UI on the preserved pairs. No Service; view from your Mac with:
                #   kubectl port-forward <pod> 3001:3001 3002:3002   -> http://localhost:3001
                if [[ "${EXPLORER:-0}" = "1" && -n "${RESULTS}" ]]; then
                  bash scripts/prof/explorer_ingest.sh "${RESULTS}"
                fi
                echo "Keeping pod alive for ${KEEP_ALIVE_SECONDS}s. Pull results with:"
                echo "  kubectl cp $(hostname):${RESULTS}.tar.gz ./$(basename "${RESULTS:-results}").tar.gz"
                echo "  kubectl cp $(hostname):${RESULTS}/output_clean.mp4 ./output_clean.mp4"
                sleep "${KEEP_ALIVE_SECONDS}"
              fi
          resources:
            claims:
              - name: s-lnc1
            requests:
              cpu: 88
              memory: 880Gi
              ephemeral-storage: 120Gi
            limits:
              cpu: 180
              memory: 1800Gi
              ephemeral-storage: 200Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            #- name: 621547421844-ap-southeast-4-pvc
            #  mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: TORCH_NEURONX_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_RT_DBG_INTRA_RDH_CHANNEL_BUFFER_SIZE
              value: "134217728"
            - name: NEURON_CC_FLAGS
              value: "--model-type=transformer"
            - name: TORCH_NEURONX_FALLBACK_ONLY_FOR_UNIMPLEMENTED_OPS
              value: "0"
            # Source locations in the NEFFs for the Neuron Explorer Code Editor (set before compile)
            - name: XLA_IR_DEBUG
              value: "1"
            - name: XLA_HLO_DEBUG
              value: "1"
            - name: NKI_DEBUG_INFO
              value: "True"
            - name: TP_DEGREE
              value: "8"
            - name: SP_DEGREE
              value: "1"
            - name: T5_RANK
              value: "2"
            - name: VAE_TP_DEGREE
              value: "1"
            - name: USE_NKI_KERNELS
              value: "1"
            - name: USE_NKI_VAE
              value: "1"
            - name: USE_NKI_CONV3D
              value: "1"
            - name: NKI_CONV3D_CHECK
              value: "0"
            - name: USE_NST_SELF_ATTN
              value: "1"
            - name: VAE_COMPILE
              value: "0"
            - name: VAE_TILED
              value: "1"
            - name: VAE_TILE_OVERLAP
              value: "4"
            - name: DIT_FAST
              value: "1"
            - name: FAST_ATTN_IMPL
              value: "cte"
            - name: FAST_CROSS_IMPL
              value: "cte"
            - name: CFG_PARALLEL
              value: "1"
            - name: FAST_SP
              value: "1"
            - name: FAST_LOCAL_CROSS
              value: "1"
            - name: FAST_A2A_O
              value: "1"
            - name: FAST_NKI_MLP
              value: "1"
            - name: FAST_MOD_SPLIT
              value: "1"
            - name: FAST_CROSS_MERGE
              value: "1"
            - name: CFG_GROUPS
              value: "interleave"
            - name: VAE_FUSE_NORM
              value: "1"
            - name: VAE_STREAM
              value: "1"
            - name: NKI_CONV3D_SMALL_COUT
              value: "1"
            - name: VAE_SUBPIXEL
              value: "1"
            - name: VAE_FUSE_CAT
              value: "1"
            - name: VAE_FUSE_RES
              value: "1"
            - name: VAE_FUSE_SHORTCUT
              value: "1"
            - name: VAE_TCHUNK
              value: "4"
            - name: VAE_STRIPS
              value: "1"
            - name: VAE_STRIP_NKI_NORM
              value: "1"
            - name: VAE_SUBPIXEL_MERGE
              value: "1"
            - name: VAE_STRIP_ATTN
              value: "1"
            - name: VAE_CONV1X1_MM
              value: "1"
            - name: VAE_LAT_ALL
              value: "1"
            - name: VAE_SHIP_THREAD
              value: "1"
            - name: VAE_U8_SHIP
              value: "1"
            - name: DEVICE_SCHEDULER
              value: "1"
            - name: MP4_VFORK
              value: "1"
            - name: CONST_MAX_SOFTMAX_MAX
              value: "15.0"
            - name: CONST_MAX_LAYERS
              value: "auto"
            - name: SKIP_PROFILE
              value: "0"
            - name: CLEAN_RUNS
              value: "3"
            - name: PROFILE_STEPS
              value: "2"
            - name: PROFILE_RANKS
              value: "0"
            - name: SYSTEM_RANKS
              value: "all"
            - name: DEVICE_PROFILE_MODE
              value: "session"
            - name: SWEEP_MAX
              value: "0"
            - name: MAX_PAIRS
              value: "3"
            - name: EXPLORER
              value: "1"
            - name: KEEP_ALIVE_SECONDS
              value: "86400"
            - name: NUM_STEPS
              value: "10"
            - name: NUM_RUNS
              value: "2"
            - name: FRAME_NUM
              value: "81"
            - name: INSTANCE_TYPE
              value: "trn2"
            - name: LNC_CONFIG
              value: "LNC1"
            - name: NUM_NEURON_DEVICES
              value: "1"
            - name: CUDA_VISIBLE_DEVICES
              value: ""
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        #- name: 621547421844-ap-southeast-4-pvc
        #  persistentVolumeClaim:
        #    claimName: 621547421844-ap-southeast-4-pvc
